name: Render posts

on:
  push:
    branches: [main]
    paths: ["queue/*.json", "preview/*.json"]
  workflow_dispatch:
    inputs:
      date:
        description: "Queue date to (re)render, e.g. 2026-11-08"
        required: true

concurrency:
  group: fabrika
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: sudo apt-get install -y -qq ffmpeg libcairo2-dev pkg-config > /dev/null
      - run: pip install pillow requests spylls edge-tts pycairo

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion/package-lock.json
      - name: Install Remotion (animated Reels)
        working-directory: remotion
        run: npm ci --no-audit --no-fund && npx remotion browser ensure

      - name: Find queue files to render
        id: files
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            f=queue/${{ github.event.inputs.date }}.json; [ -f "$f" ] || f=preview/${{ github.event.inputs.date }}.json
            echo "list=$f" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "list=$(ls queue/*.json | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          else
            echo "list=$(git diff --name-only --diff-filter=AM ${{ github.event.before }} ${{ github.sha }} -- 'queue/*.json' 'preview/*.json' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi

      - name: Spellcheck and render
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for f in ${{ steps.files.outputs.list }}; do
            echo "== $f"
            python fabrika/spellcheck.py "$f"
            python fabrika/render.py "$f"
          done

      - name: Commit renders
        run: |
          git config user.name "fabrika-bot"
          git config user.email "fabrika-bot@users.noreply.github.com"
          git add out data
          git diff --cached --quiet && exit 0
          git commit -m "Render posts"
          git pull --rebase
          git push
