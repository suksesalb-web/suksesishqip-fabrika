name: Voice test (Gemini)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y -qq ffmpeg > /dev/null
      - run: pip install edge-tts requests
      - name: Generate samples
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python voice/gemini_test.py
      - name: Commit samples
        run: |
          git config user.name "fabrika-bot"
          git config user.email "fabrika-bot@users.noreply.github.com"
          git add voice/samples-gemini
          git commit -m "Gemini voice samples" || exit 0
          git pull --rebase
          git push
